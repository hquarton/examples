<div>
  <div *ngIf="currentTutorial.id" class="edit-form">
    <h4>Tutorial</h4>
    <form>
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          class="form-control"
          id="title"
          [(ngModel)]="currentTutorial.title"
          name="title"
        />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input
          type="text"
          class="form-control-description"
          id="description"
          [(ngModel)]="currentTutorial.description"
          name="description"
        />
      </div>
      <div class="form-group">
        <label><strong>Version n°</strong></label>
        {{ currentTutorial.version }}
      </div>
      <div class="form-group">
        <label><strong>Dernière operation:</strong></label>
        {{ currentTutorial.operation }}
      </div>
      <div class="form-group">
        <label><strong>Status:</strong></label>
        {{ currentTutorial.published ? "Published" : "Pending" }}
      </div>
      <div class="form-group">
        <label><strong>Création le :</strong></label>
        {{ currentTutorial.createdDate }}
      </div>
      <div class="form-group">
        <label><strong>Dernière modification le :</strong></label>
        {{ currentTutorial.modifiedDate }}
      </div>
      <div class="form-group" *ngIf="currentTutorial.lastPublishedDate">
        <label><strong>Dernière publication le :</strong></label>
        {{ currentTutorial.lastPublishedDate }}
      </div>
    </form>

    <button
      class="badge badge-primary mr-2"
      *ngIf="currentTutorial.published"
      (click)="updatePublished(false)"
    >
      UnPublish
    </button>
    <button
      *ngIf="!currentTutorial.published"
      class="badge badge-primary mr-2"
      (click)="updatePublished(true)"
    >
      Publish
    </button>

    <button class="badge badge-danger mr-2" (click)="deleteTutorial()">
      Delete
    </button>

    <button
      type="submit"
      class="badge badge-success mb-2"
      (click)="updateTutorial()"
    >
      Update
    </button>
    <p>{{ message }}</p>
  </div>

  <div *ngIf="!currentTutorial.id">
    <br/>
    <p>Cannot access this Tutorial...</p>
  </div>
</div>
